"format": "rollout-runner/v3"
"id": "RUN-393"
"baseline": "538b2825c06bc1e8c5392d18f18f84faee9fca95"
"scenario":
  "source":
    "group": "2.1.1 Pod删除与recoveryPolicy组合"
    "kind": "运行"
    "config":
      "coordination": "omitted"
      "mode": "SG"
      "n": 3
      "recovery": "None"
      "roles":
        "f":
          "r": 1
          "w": 1
      "top":
        "p": 0
        "s": 1
        "u": 1
    "initial": "A全Ready；f entry配置restartPolicy=Always"
    "action": "在f ordinal0原地杀死容器进程并观察kubelet恢复；恢复Ready后提交f模板B"
    "expect": "仅容器重启阶段Pod UID保持，None不触发controller重建；随后正常模板更新仍遵守1/1/0，None不等于禁用rollout"
    "refs":
      - "L06"
    "note": ""
    "id": "RUN-393"
    "verification": "NOT_RUN_ON_BASELINE"
    "legacyGroup": "恢复策略全交叉"
    "section": "2.1.1"
    "categoryPath":
      - "2"
      - "2.1"
      - "2.1.1"
  "profile": "controlled"
  "initialSpec":
    "template":
      "roles":
        -
          "name": "frontend"
          "replicas": 1
          "workerReplicas": 1
          "entryTemplate":
            "metadata":
              "annotations":
                "production.kthena.io/ranktable": "{\"pod_name\":\"frontend-entry\",\"server_id\":\"frontend\"}"
            "spec":
              "terminationGracePeriodSeconds": 1
              "containers":
                -
                  "name": "workload"
                  "image": "busybox:1.36"
                  "imagePullPolicy": "IfNotPresent"
                  "command":
                    - "sh"
                    - "-c"
                    - "trap 'exit 42' USR1; while :; do sleep 1 & wait $!; done"
                  "env":
                    -
                      "name": "ROLLOUT_VERSION"
                      "value": "A"
                  "readinessProbe":
                    "exec":
                      "command":
                        - "test"
                        - "-f"
                        - "/tmp/ready"
                    "periodSeconds": 1
                    "failureThreshold": 1
                  "resources":
                    "requests":
                      "cpu": "5m"
                      "memory": "4Mi"
              "restartPolicy": "Always"
          "workerTemplate":
            "metadata":
              "annotations":
                "production.kthena.io/ranktable": "{\"pod_name\":\"frontend-worker\",\"server_id\":\"frontend\"}"
            "spec":
              "terminationGracePeriodSeconds": 1
              "containers":
                -
                  "name": "workload"
                  "image": "busybox:1.36"
                  "imagePullPolicy": "IfNotPresent"
                  "command":
                    - "sh"
                    - "-c"
                    - "sleep 3600"
                  "env":
                    -
                      "name": "ROLLOUT_VERSION"
                      "value": "A"
                  "readinessProbe":
                    "exec":
                      "command":
                        - "test"
                        - "-f"
                        - "/tmp/ready"
                    "periodSeconds": 1
                    "failureThreshold": 1
                  "resources":
                    "requests":
                      "cpu": "5m"
                      "memory": "4Mi"
    "replicas": 3
    "schedulerName": "volcano"
    "plugins":
      -
        "name": "headless-service"
        "type": "BuiltIn"
      -
        "name": "ranktable"
        "type": "BuiltIn"
        "config":
          "template": "production020-ranktable-template"
    "recoveryPolicy": "None"
    "rolloutStrategy":
      "type": "ServingGroupRollingUpdate"
      "rollingUpdateConfiguration":
        "partition": 0
        "maxSurge": 1
        "maxUnavailable": 1
  "steps":
    -
      "name": "exit-entry-process-and-recover-same-pod"
      "action": "restart-container"
      "until": "settled"
      "release": "none"
      "holdSeconds": 0
      "stableSeconds": 30
      "expect":
        "noReplacement": true
        "noNewRevision": true
      "containerRestart":
        "group": 0
        "role": "frontend"
        "ordinal": 0
        "member": "entry"
      "timeoutSeconds": 180
    -
      "name": "rollout-B-after-container-recovered"
      "action": "update"
      "until": "settled"
      "release": "one"
      "holdSeconds": 0
      "stableSeconds": 30
      "expect":
        "targets":
          -
            "versions":
              "B": 3
            "ordinals": {}
            "scope": "SG"
          -
            "role": "frontend"
            "workers":
              "A": 1
              "B": 1
      "spec":
        "template":
          "roles":
            -
              "name": "frontend"
              "replicas": 1
              "workerReplicas": 1
              "entryTemplate":
                "metadata":
                  "annotations":
                    "production.kthena.io/ranktable": "{\"pod_name\":\"frontend-entry\",\"server_id\":\"frontend\"}"
                "spec":
                  "terminationGracePeriodSeconds": 1
                  "containers":
                    -
                      "name": "workload"
                      "image": "busybox:1.36"
                      "imagePullPolicy": "IfNotPresent"
                      "command":
                        - "sh"
                        - "-c"
                        - "trap 'exit 42' USR1; while :; do sleep 1 & wait $!; done"
                      "env":
                        -
                          "name": "ROLLOUT_VERSION"
                          "value": "B"
                      "readinessProbe":
                        "exec":
                          "command":
                            - "test"
                            - "-f"
                            - "/tmp/ready"
                        "periodSeconds": 1
                        "failureThreshold": 1
                      "resources":
                        "requests":
                          "cpu": "5m"
                          "memory": "4Mi"
                  "restartPolicy": "Always"
              "workerTemplate":
                "metadata":
                  "annotations":
                    "production.kthena.io/ranktable": "{\"pod_name\":\"frontend-worker\",\"server_id\":\"frontend\"}"
                "spec":
                  "terminationGracePeriodSeconds": 1
                  "containers":
                    -
                      "name": "workload"
                      "image": "busybox:1.36"
                      "imagePullPolicy": "IfNotPresent"
                      "command":
                        - "sh"
                        - "-c"
                        - "sleep 3600"
                      "env":
                        -
                          "name": "ROLLOUT_VERSION"
                          "value": "B"
                      "readinessProbe":
                        "exec":
                          "command":
                            - "test"
                            - "-f"
                            - "/tmp/ready"
                        "periodSeconds": 1
                        "failureThreshold": 1
                      "resources":
                        "requests":
                          "cpu": "5m"
                          "memory": "4Mi"
        "replicas": 3
        "schedulerName": "volcano"
        "plugins":
          -
            "name": "headless-service"
            "type": "BuiltIn"
          -
            "name": "ranktable"
            "type": "BuiltIn"
            "config":
              "template": "production020-ranktable-template"
        "recoveryPolicy": "None"
        "rolloutStrategy":
          "type": "ServingGroupRollingUpdate"
          "rollingUpdateConfiguration":
            "partition": 0
            "maxSurge": 1
            "maxUnavailable": 1
      "timeoutSeconds": 420
