"format": "rollout-runner/v3"
"id": "RUN-431"
"baseline": "538b2825c06bc1e8c5392d18f18f84faee9fca95"
"scenario":
  "source":
    "group": "2.1.4 容器重启与恢复宽限期"
    "kind": "运行"
    "config":
      "coordination": "omitted"
      "mode": "SG"
      "n": 3
      "recovery": "RoleRecreate"
      "restartGracePeriodSeconds": 30
      "roles":
        "f":
          "r": 1
          "w": 1
      "top":
        "p": 0
        "s": 1
        "u": 1
    "initial": "A全Ready；entry容器可注入重启且worker健康"
    "action": "在同一轮B更新窗口中令旧entry容器发生一次可恢复重启，保持Pod存在；30秒内恢复健康"
    "expect": "宽限期影响故障恢复决策，不是rollout批次间隔；不因短暂重启错误扩大重建范围，恢复后继续B"
    "refs":
      - "L04"
    "note": ""
    "id": "RUN-431"
    "verification": "NOT_RUN_ON_BASELINE"
    "legacyGroup": "运行故障与自动恢复"
    "section": "2.1.4"
    "categoryPath":
      - "2"
      - "2.1"
      - "2.1.4"
  "profile": "controlled"
  "initialSpec":
    "template":
      "roles":
        -
          "name": "frontend"
          "replicas": 1
          "workerReplicas": 1
          "entryTemplate":
            "metadata":
              "annotations":
                "production.kthena.io/ranktable": "{\"pod_name\":\"frontend-entry\",\"server_id\":\"frontend\"}"
            "spec":
              "terminationGracePeriodSeconds": 1
              "containers":
                -
                  "name": "workload"
                  "image": "busybox:1.36"
                  "imagePullPolicy": "IfNotPresent"
                  "command":
                    - "sh"
                    - "-c"
                    - "trap 'exit 42' USR1; while :; do sleep 1 & wait $!; done"
                  "env":
                    -
                      "name": "ROLLOUT_VERSION"
                      "value": "A"
                  "readinessProbe":
                    "exec":
                      "command":
                        - "test"
                        - "-f"
                        - "/tmp/ready"
                    "periodSeconds": 1
                    "failureThreshold": 1
                  "resources":
                    "requests":
                      "cpu": "5m"
                      "memory": "4Mi"
              "restartPolicy": "Always"
          "workerTemplate":
            "metadata":
              "annotations":
                "production.kthena.io/ranktable": "{\"pod_name\":\"frontend-worker\",\"server_id\":\"frontend\"}"
            "spec":
              "terminationGracePeriodSeconds": 1
              "containers":
                -
                  "name": "workload"
                  "image": "busybox:1.36"
                  "imagePullPolicy": "IfNotPresent"
                  "command":
                    - "sh"
                    - "-c"
                    - "sleep 3600"
                  "env":
                    -
                      "name": "ROLLOUT_VERSION"
                      "value": "A"
                  "readinessProbe":
                    "exec":
                      "command":
                        - "test"
                        - "-f"
                        - "/tmp/ready"
                    "periodSeconds": 1
                    "failureThreshold": 1
                  "resources":
                    "requests":
                      "cpu": "5m"
                      "memory": "4Mi"
      "restartGracePeriodSeconds": 30
    "replicas": 3
    "schedulerName": "volcano"
    "plugins":
      -
        "name": "headless-service"
        "type": "BuiltIn"
      -
        "name": "ranktable"
        "type": "BuiltIn"
        "config":
          "template": "production020-ranktable-template"
    "recoveryPolicy": "RoleRecreate"
    "rolloutStrategy":
      "type": "ServingGroupRollingUpdate"
      "rollingUpdateConfiguration":
        "partition": 0
        "maxSurge": 1
        "maxUnavailable": 1
  "steps":
    -
      "name": "start-B-and-hold-new-readiness"
      "action": "update"
      "until": "conditions"
      "release": "none"
      "holdSeconds": 5
      "stableSeconds": 0
      "expect": {}
      "spec":
        "template":
          "roles":
            -
              "name": "frontend"
              "replicas": 1
              "workerReplicas": 1
              "entryTemplate":
                "metadata":
                  "annotations":
                    "production.kthena.io/ranktable": "{\"pod_name\":\"frontend-entry\",\"server_id\":\"frontend\"}"
                "spec":
                  "terminationGracePeriodSeconds": 1
                  "containers":
                    -
                      "name": "workload"
                      "image": "busybox:1.36"
                      "imagePullPolicy": "IfNotPresent"
                      "command":
                        - "sh"
                        - "-c"
                        - "trap 'exit 42' USR1; while :; do sleep 1 & wait $!; done"
                      "env":
                        -
                          "name": "ROLLOUT_VERSION"
                          "value": "B"
                      "readinessProbe":
                        "exec":
                          "command":
                            - "test"
                            - "-f"
                            - "/tmp/ready"
                        "periodSeconds": 1
                        "failureThreshold": 1
                      "resources":
                        "requests":
                          "cpu": "5m"
                          "memory": "4Mi"
                  "restartPolicy": "Always"
              "workerTemplate":
                "metadata":
                  "annotations":
                    "production.kthena.io/ranktable": "{\"pod_name\":\"frontend-worker\",\"server_id\":\"frontend\"}"
                "spec":
                  "terminationGracePeriodSeconds": 1
                  "containers":
                    -
                      "name": "workload"
                      "image": "busybox:1.36"
                      "imagePullPolicy": "IfNotPresent"
                      "command":
                        - "sh"
                        - "-c"
                        - "sleep 3600"
                      "env":
                        -
                          "name": "ROLLOUT_VERSION"
                          "value": "B"
                      "readinessProbe":
                        "exec":
                          "command":
                            - "test"
                            - "-f"
                            - "/tmp/ready"
                        "periodSeconds": 1
                        "failureThreshold": 1
                      "resources":
                        "requests":
                          "cpu": "5m"
                          "memory": "4Mi"
          "restartGracePeriodSeconds": 30
        "replicas": 3
        "schedulerName": "volcano"
        "plugins":
          -
            "name": "headless-service"
            "type": "BuiltIn"
          -
            "name": "ranktable"
            "type": "BuiltIn"
            "config":
              "template": "production020-ranktable-template"
        "recoveryPolicy": "RoleRecreate"
        "rolloutStrategy":
          "type": "ServingGroupRollingUpdate"
          "rollingUpdateConfiguration":
            "partition": 0
            "maxSurge": 1
            "maxUnavailable": 1
      "conditions":
        -
          "kind": "unit"
          "role": "frontend"
          "group": 0
          "ordinal": 0
          "version": "A"
          "ready": true
          "count": 1
        -
          "kind": "running-not-ready"
          "role": "frontend"
          "version": "B"
          "count": 1
      "timeoutSeconds": 180
    -
      "name": "old-entry-restarts-within-template-grace"
      "action": "restart-container-grace"
      "until": "conditions"
      "release": "none"
      "holdSeconds": 5
      "stableSeconds": 0
      "expect":
        "noNewRevision": true
      "containerRestart":
        "group": 0
        "role": "frontend"
        "ordinal": 0
        "member": "entry"
      "conditions":
        -
          "kind": "unit"
          "role": "frontend"
          "group": 0
          "ordinal": 0
          "version": "A"
          "ready": true
          "count": 1
        -
          "kind": "running-not-ready"
          "role": "frontend"
          "version": "B"
          "count": 1
      "timeoutSeconds": 45
    -
      "name": "finish-B-after-bounded-restart"
      "action": "resume-after-grace"
      "until": "settled"
      "release": "one"
      "holdSeconds": 0
      "stableSeconds": 30
      "expect":
        "targets":
          -
            "scope": "SG"
            "versions":
              "B": 3
          -
            "role": "frontend"
            "workers":
              "B": 1
      "timeoutSeconds": 420
