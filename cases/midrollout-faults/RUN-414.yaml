            "role": "frontend"
            "versions":
              "B": 3
            "workers":
              "B": 0
          -
            "role": "backend"
            "versions":
              "A": 3
            "workers":
              "A": 0
            "ordinals":
              "0": "A"
              "1": "A"
              "2": "A"
      "timeoutSeconds": 420
