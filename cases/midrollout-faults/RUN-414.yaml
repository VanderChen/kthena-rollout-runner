"scenario":
  "source":
    "group": "2.1.2 Pending、NotReady、Ready回退与镜像故障"
    "kind": "运行"
    "config":
      "coordination": "omitted"
      "mode": "Role"
      "n": 1
      "recovery": "omitted"
      "roles":
        "b":
          "r": 3
          "w": 0
        "f":
          "p": 0
          "r": 3
          "s": 0
          "u": 1
          "w": 0
    "initial": "连续ordinal；A全Ready；故障类型=NotReady"
    "action": "提交可启动但readiness持续失败的B；记录停点后放开探针"
    "expect": "Running不能当Ready；未就绪B不提供健康旧实例的额外删除额度；恢复Ready后自动完成；活动f实例≤3、Ready容量≥2；最终0个受保护A+3个B，活动数回3；b的UID保持"
    "refs":
      - "L02"
    "note": ""
    "id": "RUN-414"
    "verification": "NOT_RUN_ON_BASELINE"
    "legacyGroup": "运行故障与自动恢复"
    "section": "2.1.2"
    "categoryPath":
      - "2"
      - "2.1"
      - "2.1.2"
  "profile": "controlled"
  "initialSpec":
    "template":
      "roles":
        -
          "name": "backend"
          "replicas": 3
          "workerReplicas": 0
          "entryTemplate":
            "metadata":
              "annotations":
                "production.kthena.io/ranktable": "{\"pod_name\":\"backend-entry\",\"server_id\":\"backend\"}"
            "spec":
              "terminationGracePeriodSeconds": 1
              "containers":
                -
                  "name": "workload"
                  "image": "busybox:1.36"
                  "imagePullPolicy": "IfNotPresent"
                  "command":
                    - "sh"
                    - "-c"
                    - "sleep 3600"
                  "env":
                    -
                      "name": "ROLLOUT_VERSION"
                      "value": "A"
                  "readinessProbe":
                    "exec":
                      "command":
                        - "test"
                        - "-f"
                        - "/tmp/ready"
                    "periodSeconds": 1
                    "failureThreshold": 1
                  "resources":
                    "requests":
                      "cpu": "5m"
                      "memory": "4Mi"
        -
          "name": "frontend"
          "replicas": 3
          "workerReplicas": 0
          "maxUnavailable": 1
          "maxSurge": 0
          "partition": 0
          "entryTemplate":
            "metadata":
              "annotations":
                "production.kthena.io/ranktable": "{\"pod_name\":\"frontend-entry\",\"server_id\":\"frontend\"}"
            "spec":
              "terminationGracePeriodSeconds": 1
              "containers":
                -
                  "name": "workload"
                  "image": "busybox:1.36"
                  "imagePullPolicy": "IfNotPresent"
                  "command":
                    - "sh"
                    - "-c"
                    - "sleep 3600"
                  "env":
                    -
                      "name": "ROLLOUT_VERSION"
                      "value": "A"
                  "readinessProbe":
                    "exec":
                      "command":
                        - "test"
                        - "-f"
                        - "/tmp/ready"
                    "periodSeconds": 1
                    "failureThreshold": 1
                  "resources":
                    "requests":
                      "cpu": "5m"
                      "memory": "4Mi"
    "replicas": 1
    "schedulerName": "volcano"
    "plugins":
      -
        "name": "headless-service"
        "type": "BuiltIn"
      -
        "name": "ranktable"
        "type": "BuiltIn"
        "config":
          "template": "production020-ranktable-template"
    "rolloutStrategy":
      "type": "RoleRollingUpdate"
  "steps":
