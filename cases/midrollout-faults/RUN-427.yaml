      "mode": "SG"
      "n": 3
      "recovery": "omitted"
      "roles":
        "f":
          "r": 1
          "w": 0
      "top":
        "p": 0
        "s": 1
        "u": 1
    "initial": "连续ordinal；A全Ready；故障类型=终止阻塞"
    "action": "提交B；对首个待删旧实例Pod预置测试finalizer，确认terminating后移除finalizer"
    "expect": "把terminating与活动容量分开统计；不重复分配/遗忘删除意图；解除后自动清理并完成；活动组≤4、Ready容量≥2；最终0个受保护A+3个B，活动数回3"
    "refs":
      - "L07"
      - "S05"
    "note": ""
    "id": "RUN-427"
    "verification": "NOT_RUN_ON_BASELINE"
    "legacyGroup": "运行故障与自动恢复"
    "section": "2.1.3"
    "categoryPath":
      - "2"
      - "2.1"
      - "2.1.3"
  "profile": "controlled"
  "initialSpec":
    "template":
      "roles":
        -
          "name": "frontend"
          "replicas": 1
          "workerReplicas": 0
          "entryTemplate":
            "metadata":
              "annotations":
                "production.kthena.io/ranktable": "{\"pod_name\":\"frontend-entry\",\"server_id\":\"frontend\"}"
            "spec":
              "terminationGracePeriodSeconds": 1
              "containers":
                -
                  "name": "workload"
                  "image": "busybox:1.36"
                  "imagePullPolicy": "IfNotPresent"
                  "command":
                    - "sh"
                    - "-c"
                    - "sleep 3600"
                  "env":
                    -
                      "name": "ROLLOUT_VERSION"
                      "value": "A"
                  "readinessProbe":
                    "exec":
                      "command":
                        - "test"
                        - "-f"
                        - "/tmp/ready"
                    "periodSeconds": 1
                    "failureThreshold": 1
                  "resources":
                    "requests":
                      "cpu": "5m"
                      "memory": "4Mi"
    "replicas": 3
    "schedulerName": "volcano"
    "plugins":
      -
        "name": "headless-service"
        "type": "BuiltIn"
      -
        "name": "ranktable"
        "type": "BuiltIn"
        "config":
          "template": "production020-ranktable-template"
    "rolloutStrategy":
      "type": "ServingGroupRollingUpdate"
      "rollingUpdateConfiguration":
        "partition": 0
        "maxSurge": 1
        "maxUnavailable": 1
  "steps":
    -
      "name": "pin-first-old-instance"
      "action": "pin"
      "until": "settled"
      "release": "none"
      "holdSeconds": 0
      "stableSeconds": 0
      "expect":
        "noReplacement": true
        "noNewRevision": true
      "conditions":
        -
          "kind": "unit"
          "version": "A"
          "ordinal": 2
          "count": 1
      "timeoutSeconds": 420
    -
      "name": "B-with-old-instance-terminating"
      "action": "update"
      "until": "conditions"
      "release": "one"
      "holdSeconds": 10
      "stableSeconds": 0
      "expect": {}
      "spec":
        "template":
          "roles":
            -
              "name": "frontend"
              "replicas": 1
              "workerReplicas": 0
              "entryTemplate":
                "metadata":
                  "annotations":
                    "production.kthena.io/ranktable": "{\"pod_name\":\"frontend-entry\",\"server_id\":\"frontend\"}"
                "spec":
                  "terminationGracePeriodSeconds": 1
                  "containers":
                    -
                      "name": "workload"
                      "image": "busybox:1.36"
                      "imagePullPolicy": "IfNotPresent"
                      "command":
                        - "sh"
                        - "-c"
                        - "sleep 3600"
                      "env":
                        -
                          "name": "ROLLOUT_VERSION"
                          "value": "B"
                      "readinessProbe":
                        "exec":
                          "command":
                            - "test"
                            - "-f"
                            - "/tmp/ready"
                        "periodSeconds": 1
                        "failureThreshold": 1
                      "resources":
                        "requests":
                          "cpu": "5m"
                          "memory": "4Mi"
        "replicas": 3
        "schedulerName": "volcano"
        "plugins":
          -
            "name": "headless-service"
            "type": "BuiltIn"
          -
            "name": "ranktable"
            "type": "BuiltIn"
            "config":
              "template": "production020-ranktable-template"
        "rolloutStrategy":
          "type": "ServingGroupRollingUpdate"
          "rollingUpdateConfiguration":
            "partition": 0
            "maxSurge": 1
            "maxUnavailable": 1
      "conditions":
        -
          "kind": "terminating"
          "version": "A"
          "ordinal": 2
          "count": 1
      "timeoutSeconds": 420
    -
      "name": "remove-finalizer-and-complete-B"
      "action": "unpin"
      "until": "settled"
      "release": "one"
      "holdSeconds": 0
      "stableSeconds": 30
      "expect":
        "targets":
          -
            "scope": "SG"
            "versions":
              "B": 3
      "timeoutSeconds": 420
