"format": "rollout-runner/v2"
"id": "RUN-111"
"baseline": "538b2825c06bc1e8c5392d18f18f84faee9fca95"
"scenario":
  "source":
    "group": "1.1.4 Gang、Eviction预算与插件正常组合"
    "kind": "运行"
    "config":
      "coordination": "omitted"
      "eviction":
        "level": "SG"
        "min": 3
        "role": "f"
      "mode": "SG"
      "n": 3
      "recovery": "omitted"
      "roles":
        "f":
          "r": 1
          "w": 0
      "top":
        "p": 0
        "s": 0
        "u": 1
    "initial": "A全Ready；eviction minimum等于该层期望容量"
    "action": "仅更新f模板B，不发起外部eviction"
    "expect": "eviction保护不是rollout第二个U；主动模板替换仍可按U=1执行，不因minimum=D冻结"
    "refs":
      - "E02"
      - "E03"
      - "E04"
    "note": ""
    "id": "RUN-111"
    "verification": "NOT_RUN_ON_BASELINE"
    "legacyGroup": "Eviction、调度与插件"
    "section": "1.1.4"
    "categoryPath":
      - "1"
      - "1.1"
      - "1.1.4"
  "profile": "controlled"
  "initialSpec":
    "template":
      "roles":
        -
          "name": "frontend"
          "replicas": 1
          "workerReplicas": 0
          "entryTemplate":
            "metadata":
              "annotations":
                "production.kthena.io/ranktable": "{\"pod_name\":\"frontend-entry\",\"server_id\":\"frontend\"}"
            "spec":
              "terminationGracePeriodSeconds": 1
              "containers":
                -
                  "name": "workload"
                  "image": "busybox:1.36"
                  "imagePullPolicy": "IfNotPresent"
                  "command":
                    - "sh"
                    - "-c"
                    - "sleep 3600"
                  "env":
                    -
                      "name": "ROLLOUT_VERSION"
                      "value": "A"
                  "readinessProbe":
                    "exec":
                      "command":
                        - "test"
                        - "-f"
                        - "/tmp/ready"
                    "periodSeconds": 1
                    "failureThreshold": 1
                  "resources":
                    "requests":
                      "cpu": "5m"
                      "memory": "4Mi"
    "replicas": 3
    "schedulerName": "volcano"
    "plugins":
      -
        "name": "headless-service"
        "type": "BuiltIn"
      -
        "name": "ranktable"
        "type": "BuiltIn"
        "config":
          "template": "production020-ranktable-template"
    "rolloutStrategy":
      "type": "ServingGroupRollingUpdate"
      "rollingUpdateConfiguration":
        "partition": 0
        "maxSurge": 0
        "maxUnavailable": 1
      "evictionStrategy":
        "protectionLevel": "ServingGroup"
        "minAvailable": 3
  "steps":
    -
      "name": "rollout-with-configured-plugins-and-budgets"
      "action": "update"
      "until": "settled"
      "release": "one"
      "holdSeconds": 0
      "stableSeconds": 10
      "expect": {}
      "spec":
        "template":
          "roles":
            -
              "name": "frontend"
              "replicas": 1
              "workerReplicas": 0
              "entryTemplate":
                "metadata":
                  "annotations":
                    "production.kthena.io/ranktable": "{\"pod_name\":\"frontend-entry\",\"server_id\":\"frontend\"}"
                "spec":
                  "terminationGracePeriodSeconds": 1
                  "containers":
                    -
                      "name": "workload"
                      "image": "busybox:1.36"
