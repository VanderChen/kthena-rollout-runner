"scenario":
  "source":
    "group": "1.1.4 Gang、Eviction预算与插件正常组合"
    "kind": "运行"
    "config":
      "coordination": "omitted"
      "gangPolicy":
        "minRoleReplicas":
          "f": 1
      "mode": "SG"
      "n": 3
      "recovery": "omitted"
      "roles":
        "f":
          "r": 3
          "w": 0
      "top":
        "p": 0
        "s": 1
        "u": 0
    "initial": "A全Ready；显式部分gang minimum"
    "action": "将f模板A→B"
    "expect": "按显式minimum产生正确PodGroup，不将gang minimum当作coordination依赖；B可调度后按0/1/0完成"
    "refs":
      - "X01"
    "note": ""
    "id": "RUN-114"
    "verification": "NOT_RUN_ON_BASELINE"
    "legacyGroup": "Eviction、调度与插件"
    "section": "1.1.4"
    "categoryPath":
      - "1"
      - "1.1"
      - "1.1.4"
  "profile": "controlled"
  "initialSpec":
    "template":
      "roles":
        -
          "name": "frontend"
          "replicas": 3
          "workerReplicas": 0
          "entryTemplate":
            "metadata":
              "annotations":
                "production.kthena.io/ranktable": "{\"pod_name\":\"frontend-entry\",\"server_id\":\"frontend\"}"
            "spec":
              "terminationGracePeriodSeconds": 1
              "containers":
                -
                  "name": "workload"
                  "image": "busybox:1.36"
                  "imagePullPolicy": "IfNotPresent"
                  "command":
                    - "sh"
                    - "-c"
                    - "sleep 3600"
                  "env":
                    -
                      "name": "ROLLOUT_VERSION"
                      "value": "A"
                  "readinessProbe":
                    "exec":
                      "command":
                        - "test"
                        - "-f"
                        - "/tmp/ready"
                    "periodSeconds": 1
                    "failureThreshold": 1
                  "resources":
                    "requests":
                      "cpu": "5m"
                      "memory": "4Mi"
      "gangPolicy":
        "minRoleReplicas":
          "frontend": 1
    "replicas": 3
    "schedulerName": "volcano"
    "plugins":
      -
        "name": "headless-service"
        "type": "BuiltIn"
      -
        "name": "ranktable"
        "type": "BuiltIn"
        "config":
          "template": "production020-ranktable-template"
    "rolloutStrategy":
      "type": "ServingGroupRollingUpdate"
      "rollingUpdateConfiguration":
        "partition": 0
        "maxSurge": 1
        "maxUnavailable": 0
