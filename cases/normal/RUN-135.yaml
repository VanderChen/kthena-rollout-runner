"format": "rollout-runner/v2"
"id": "RUN-135"
"baseline": "538b2825c06bc1e8c5392d18f18f84faee9fca95"
"scenario":
  "source":
    "group": "1.1.6 无操作、等价提交与非模板策略变更"
    "kind": "运行"
    "config":
      "coordination": "omitted"
      "mode": "SG"
      "n": 3
      "recovery": "omitted"
      "roles":
        "b":
          "r": 1
          "w": 0
        "f":
          "r": 1
          "w": 0
      "top":
        "p": 0
        "s": 1
        "u": 1
    "initial": "A全Ready；连续ordinal"
    "action": "只改ModelServing外层labels/annotations"
    "expect": "Pod模板不变，健康UID全部保持"
    "refs":
      - "T10"
    "note": ""
    "id": "RUN-135"
    "verification": "NOT_RUN_ON_BASELINE"
    "legacyGroup": "变更触发与运行中改配置"
    "section": "1.1.6"
    "categoryPath":
      - "1"
      - "1.1"
      - "1.1.6"
  "profile": "controlled"
  "initialSpec":
    "template":
      "roles":
        -
          "name": "backend"
          "replicas": 1
          "workerReplicas": 0
          "entryTemplate":
            "metadata":
              "annotations":
                "production.kthena.io/ranktable": "{\"pod_name\":\"backend-entry\",\"server_id\":\"backend\"}"
            "spec":
              "terminationGracePeriodSeconds": 1
              "containers":
                -
                  "name": "workload"
                  "image": "busybox:1.36"
                  "imagePullPolicy": "IfNotPresent"
                  "command":
                    - "sh"
                    - "-c"
                    - "sleep 3600"
                  "env":
                    -
                      "name": "ROLLOUT_VERSION"
                      "value": "A"
                  "readinessProbe":
                    "exec":
                      "command":
                        - "test"
                        - "-f"
                        - "/tmp/ready"
                    "periodSeconds": 1
                    "failureThreshold": 1
                  "resources":
                    "requests":
                      "cpu": "5m"
                      "memory": "4Mi"
        -
          "name": "frontend"
          "replicas": 1
          "workerReplicas": 0
          "entryTemplate":
            "metadata":
              "annotations":
                "production.kthena.io/ranktable": "{\"pod_name\":\"frontend-entry\",\"server_id\":\"frontend\"}"
            "spec":
              "terminationGracePeriodSeconds": 1
              "containers":
                -
                  "name": "workload"
                  "image": "busybox:1.36"
                  "imagePullPolicy": "IfNotPresent"
                  "command":
                    - "sh"
                    - "-c"
                    - "sleep 3600"
                  "env":
                    -
                      "name": "ROLLOUT_VERSION"
                      "value": "A"
                  "readinessProbe":
                    "exec":
                      "command":
                        - "test"
                        - "-f"
                        - "/tmp/ready"
                    "periodSeconds": 1
                    "failureThreshold": 1
                  "resources":
                    "requests":
                      "cpu": "5m"
                      "memory": "4Mi"
    "replicas": 3
    "schedulerName": "volcano"
    "plugins":
      -
        "name": "headless-service"
        "type": "BuiltIn"
      -
        "name": "ranktable"
        "type": "BuiltIn"
        "config":
          "template": "production020-ranktable-template"
    "rolloutStrategy":
      "type": "ServingGroupRollingUpdate"
      "rollingUpdateConfiguration":
        "partition": 0
        "maxSurge": 1
        "maxUnavailable": 1
  "steps":
    -
      "name": "outer-metadata"
      "action": "merge-patch"
      "until": "settled"
      "release": "one"
      "holdSeconds": 0
      "stableSeconds": 10
      "expect":
        "noReplacement": true
      "patch":
        "metadata":
          "labels":
            "normal-case": "metadata"
          "annotations":
            "normal-case": "metadata"
