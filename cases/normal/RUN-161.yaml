          "replicas": 1
          "workerReplicas": 0
          "maxUnavailable": 0
          "maxSurge": 1
          "partition": 0
          "entryTemplate":
            "metadata":
              "annotations":
                "production.kthena.io/ranktable": "{\"pod_name\":\"backend-entry\",\"server_id\":\"backend\"}"
            "spec":
              "terminationGracePeriodSeconds": 1
              "containers":
                -
                  "name": "workload"
                  "image": "busybox:1.36"
                  "imagePullPolicy": "IfNotPresent"
                  "command":
                    - "sh"
                    - "-c"
                    - "sleep 3600"
                  "env":
                    -
                      "name": "ROLLOUT_VERSION"
                      "value": "A"
                  "readinessProbe":
                    "exec":
                      "command":
                        - "test"
                        - "-f"
                        - "/tmp/ready"
                    "periodSeconds": 1
                    "failureThreshold": 1
                  "resources":
                    "requests":
