"scenario":
  "source":
    "group": "1.2.1 滚动过程中扩缩容"
    "kind": "运行"
    "config":
      "coordination": "omitted"
      "mode": "SG"
      "n": 3
      "recovery": "omitted"
      "roles":
        "f":
          "r": 1
          "w": 0
      "top":
        "u": 1
        "s": 0
        "p": 1
    "initial": "连续ordinal；A全Ready；所有后续新Pod默认NotReady，由runner按UID逐个放行"
    "action": "提交f模板B并按门控达到所述灰度停点，稳定30秒后仅改N:3→5；门控放行新增3、4"
    "expect": "缩放前A{0}+B{1,2}；新增3、4为B，不重滚原B；最终A{0}+B{1,2,3,4}，原有0/1/2 UID保持，稳定30秒"
    "refs":
      - "P11"
      - "P14"
      - "T04"
      - "T05"
    "note": "新增规划；适用§A.4阶段化验收。尚未实现此交错用例，NOT_RUN_ON_BASELINE。"
    "id": "RUN-207"
    "verification": "NOT_RUN_ON_BASELINE"
    "subgroup": "停驻灰度与partition边界"
    "executionProfile": "HOLD_READY"
    "legacyGroup": "滚动中扩缩容与partition灰度"
    "section": "1.2.1"
    "categoryPath":
      - "1"
      - "1.2"
      - "1.2.1"
  "profile": "controlled"
  "initialSpec":
    "template":
      "roles":
        -
          "name": "frontend"
          "replicas": 1
          "workerReplicas": 0
          "entryTemplate":
            "metadata":
              "annotations":
                "production.kthena.io/ranktable": "{\"pod_name\":\"frontend-entry\",\"server_id\":\"frontend\"}"
            "spec":
              "terminationGracePeriodSeconds": 1
              "containers":
                -
                  "name": "workload"
                  "image": "busybox:1.36"
                  "imagePullPolicy": "IfNotPresent"
                  "command":
                    - "sh"
                    - "-c"
                    - "sleep 3600"
                  "env":
                    -
                      "name": "ROLLOUT_VERSION"
                      "value": "A"
                  "readinessProbe":
                    "exec":
                      "command":
                        - "test"
                        - "-f"
                        - "/tmp/ready"
                    "periodSeconds": 1
                    "failureThreshold": 1
                  "resources":
                    "requests":
                      "cpu": "5m"
                      "memory": "4Mi"
    "replicas": 3
    "schedulerName": "volcano"
    "plugins":
      -
        "name": "headless-service"
        "type": "BuiltIn"
      -
        "name": "ranktable"
        "type": "BuiltIn"
        "config":
          "template": "production020-ranktable-template"
    "rolloutStrategy":
      "type": "ServingGroupRollingUpdate"
      "rollingUpdateConfiguration":
        "maxUnavailable": 1
        "maxSurge": 0
        "partition": 1
