    "expect": "P：3→2；缩放前A{0,1,2}+B{3,4}；先缩容4、3，原A2因新P被解锁后按U=1更新；最终A{0,1}+B{2}，0/1 UID保留，稳定30秒；b全程保持A及原UID"
