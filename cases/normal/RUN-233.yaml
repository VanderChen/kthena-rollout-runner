    "initial": "连续ordinal；A全Ready；所有后续新Pod默认NotReady，由runner按UID逐个放行"
    "action": "提交f模板B；观察两个SG均达到f:A{0}+B{1,2}、b全A的停点并稳定30秒后，仅改N:2→3；门控放行"
    "expect": "已有SG0/1仍各保留受保护f0的A及UID，按各自R=3/U=1独立记账；新SG2按当前模板创建全部f为B（含f0）、b为A，不能把既有SG的旧版本保护解释成新SG必须生成旧f0；最终N=3，各f.R=3；旧SG的b UID保持"
    "refs":
      - "P13"
      - "P14"
      - "T04"
      - "T05"
    "note": "新增规划；适用§A.4阶段化验收。尚未实现此交错用例，NOT_RUN_ON_BASELINE。"
