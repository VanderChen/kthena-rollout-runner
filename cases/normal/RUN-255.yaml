    "action": "先单独提交f PodSpec A→B；自动Ready滚动中观察任一SG的旧f5开始删除且仍在途，立即单独改N:2→3"
    "expect": "f的D仍6、U=1，各SG独立记账；新SG2按目标模板创建6个B f和A b，不重滚已有SG；所有保留SG最终f全B；保留原SG的b UID不变，最终N=3，每组f.R=6，稳定30秒"
    "refs":
      - "P14"
      - "T04"
      - "T05"
    "note": "新增规划；必须证明副本变更与尚未完成的原滚动实际重叠；未命中标TRIGGER_MISSED，不能PASS。"
    "id": "RUN-255"
