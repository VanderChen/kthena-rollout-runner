    "initial": "连续ordinal；A全Ready；沿用§A.2.2启动即创建ready文件及真实探针，A/B均自动Ready，runner不阻塞或逐个放行"
    "action": "先单独提交f PodSpec A→B；自动Ready滚动中观察旧5开始删除且仍在途，立即单独改N:6→8"
    "expect": "P：3→4；按修改时已观察到的旧UID/在途/已完成B集合判定新保护范围，既有B不回退，尚未开始且落入新保护范围的A不再启动；缩容仅删除允许集合；最终活动数8，所有保留的ordinal≥4均为B，低ordinal按历史及已发出动作验收，不强求A数=P；全Ready并稳定30秒"
    "refs":
      - "P10"
      - "P11"
      - "P14"
    "note": "新增规划；必须证明副本变更与尚未完成的原滚动实际重叠；未命中标TRIGGER_MISSED，不能PASS。"
    "id": "RUN-259"
    "verification": "NOT_RUN_ON_BASELINE"
    "subgroup": "正常自动Ready下的真实交错"
    "executionProfile": "AUTO_READY_INTERLEAVE"
