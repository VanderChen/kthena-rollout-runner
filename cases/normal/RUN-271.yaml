    "initial": "连续ordinal；A全Ready；沿用§A.2.2启动即创建ready文件及真实探针，A/B均自动Ready，runner不阻塞或逐个放行"
    "action": "从Ready A基线用同一次Update/patch同时提交f.R:2→3、f entry/worker PodSpec A→B及W:1→2；A/B正常自动Ready"
    "expect": "SG0受P=1保护，历史A/W=1与最新R=3组合，最终6个Pod；SG1/2用B/W=2及R=3，各9个Pod；只允许必要的组内缩容删除保护组成员，不允许借R/W合并更新重滚SG0；PodGroup/Ranktable按有效布局同步；稳定30秒"
    "refs":
      - "P13"
      - "P14"
      - "T05"
      - "H09"
    "note": "新增规划；副本数和PodSpec在同一个API请求中提交，不能拆成两次patch。"
    "id": "RUN-271"
    "verification": "NOT_RUN_ON_BASELINE"
    "subgroup": "单请求同时修改副本数与PodSpec"
    "executionProfile": "ATOMIC_SPEC_SCALE"
    "legacyGroup": "滚动中扩缩容与partition灰度"
    "section": "1.2.1"
    "categoryPath":
      - "1"
      - "1.2"
      - "1.2.1"
  "profile": "auto"
  "initialSpec":
    "template":
      "roles":
        -
          "name": "frontend"
          "replicas": 2
          "workerReplicas": 1
          "entryTemplate":
            "metadata":
              "annotations":
                "production.kthena.io/ranktable": "{\"pod_name\":\"frontend-entry\",\"server_id\":\"frontend\"}"
            "spec":
              "terminationGracePeriodSeconds": 1
              "containers":
                -
                  "name": "workload"
                  "image": "busybox:1.36"
                  "imagePullPolicy": "IfNotPresent"
                  "command":
                    - "sh"
                    - "-c"
                    - "touch /tmp/ready; sleep 3600"
                  "env":
                    -
                      "name": "ROLLOUT_VERSION"
                      "value": "A"
                  "readinessProbe":
                    "exec":
                      "command":
                        - "test"
                        - "-f"
                        - "/tmp/ready"
                    "periodSeconds": 1
                    "failureThreshold": 1
                  "resources":
                    "requests":
                      "cpu": "5m"
                      "memory": "4Mi"
          "workerTemplate":
            "metadata":
              "annotations":
                "production.kthena.io/ranktable": "{\"pod_name\":\"frontend-worker\",\"server_id\":\"frontend\"}"
            "spec":
              "terminationGracePeriodSeconds": 1
              "containers":
                -
                  "name": "workload"
                  "image": "busybox:1.36"
                  "imagePullPolicy": "IfNotPresent"
                  "command":
                    - "sh"
                    - "-c"
                    - "touch /tmp/ready; sleep 3600"
                  "env":
                    -
                      "name": "ROLLOUT_VERSION"
                      "value": "A"
                  "readinessProbe":
                    "exec":
                      "command":
                        - "test"
                        - "-f"
                        - "/tmp/ready"
                    "periodSeconds": 1
                    "failureThreshold": 1
                  "resources":
                    "requests":
                      "cpu": "5m"
                      "memory": "4Mi"
    "replicas": 3
    "schedulerName": "volcano"
    "plugins":
      -
        "name": "headless-service"
        "type": "BuiltIn"
      -
        "name": "ranktable"
        "type": "BuiltIn"
        "config":
          "template": "production020-ranktable-template"
    "rolloutStrategy":
      "type": "ServingGroupRollingUpdate"
      "rollingUpdateConfiguration":
        "maxUnavailable": 1
        "maxSurge": 0
        "partition": 1
