                    "exec":
                      "command":
                        - "test"
                        - "-f"
                        - "/tmp/ready"
                    "periodSeconds": 1
                    "failureThreshold": 1
                  "resources":
                    "requests":
                      "cpu": "5m"
                      "memory": "4Mi"
    "replicas": 2
    "schedulerName": "volcano"
    "plugins":
