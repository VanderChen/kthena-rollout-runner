      - "T05"
    "note": "新增规划；副本数和PodSpec在同一个API请求中提交，不能拆成两次patch。"
    "id": "RUN-274"
    "verification": "NOT_RUN_ON_BASELINE"
    "subgroup": "单请求同时修改副本数与PodSpec"
    "executionProfile": "ATOMIC_SPEC_SCALE"
