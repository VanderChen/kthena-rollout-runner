    "initial": "连续ordinal；A全Ready；沿用§A.2.2启动即创建ready文件及真实探针，A/B均自动Ready，runner不阻塞或逐个放行"
    "action": "从Ready A基线用同一次Update/patch同时提交N:2→1和f PodSpec A→B；f.R=3及P=1不变，A/B正常自动Ready"
    "expect": "Ready A基线等健康等级/成本，先合法缩掉SG1，包括其f0；SG0保留f0旧A及b原UID，f1/2更新为B；不能因Role partition阻止顶层缩容；最终N=1，f.R=3，稳定30秒"
    "refs":
