    "initial": "A全Ready；测试注入点=headless-service删除hook"
    "action": "提交B；令所列hook连续失败2次再恢复"
    "expect": "保留清理/重试意图，状态不提前宣告清理完成；恢复后自动重新入队并清理，不泄漏旧/surge资源，不误删新UID"
