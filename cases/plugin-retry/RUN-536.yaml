              "replicas": 1
              "workerReplicas": 0
              "entryTemplate":
                "metadata":
                  "annotations":
                    "production.kthena.io/ranktable": "{\"pod_name\":\"frontend-entry\",\"server_id\":\"frontend\"}"
                "spec":
                  "terminationGracePeriodSeconds": 1
                  "containers":
                    -
                      "name": "workload"
                      "image": "busybox:1.36"
                      "imagePullPolicy": "IfNotPresent"
                      "command":
                        - "sh"
                        - "-c"
                        - "sleep 3600"
                      "env":
