              "spec": {
                "terminationGracePeriodSeconds": 1,
                "containers": [
                  {
                    "name": "workload",
                    "image": "busybox:1.36",
                    "imagePullPolicy": "IfNotPresent",
                    "command": [
                      "sh",
                      "-c",
                      "sleep 3600"
