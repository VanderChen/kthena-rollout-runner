                    "env": [
                      {
                        "name": "ROLLOUT_VERSION",
                        "value": "A"
                      }
                    ],
                    "readinessProbe": {
                      "exec": {
                        "command": [
                          "test",
                          "-f",
                          "/tmp/ready"
