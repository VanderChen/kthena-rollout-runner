"format": "rollout-runner/v3"
"id": "RUN-654"
"baseline": "538b2825c06bc1e8c5392d18f18f84faee9fca95"
"scenario":
  "requires": "servingGroupObjects"
  "source":
    "id": "RUN-654"
    "designID": "NT2"
    "group": "ServingGroup对象"
    "kind": "运行"
    "contract": "2.14"
    "reference": "kthena/docs/proposal/modelserving-servinggroup-cr/04-behavior-expectations.md#8.7"
    "config":
      "coordination": "omitted"
      "mode": "SG"
      "n": 2
      "plugins": "omitted"
      "recovery": "ServingGroupRecreate"
      "roles":
        "f":
          "r": 1
          "w": 1
      "top":
        "p": 0
        "s": 0
        "u": 1
    "initial": "A全Ready"
    "action": "整组恢复的两步删除：ServingGroupRecreate、grace=0，组0的entry容器异常重启且不Ready，同组worker健康"
    "expect": "先只有故障成员被删；它消失之前健康成员没有deletionTimestamp；之后组进入终止中，健康成员被删；全部消失之后在同一个序号上重建，版本按序号和partition；组1不动"
    "mustReject": "故障成员没停就删了其余成员；重建落到别的序号；重建用错版本"
  "profile": "controlled"
  "initialSpec":
    "template":
      "roles":
        -
          "name": "frontend"
          "replicas": 1
          "workerReplicas": 1
          "entryTemplate":
            "metadata":
              "annotations":
                "production.kthena.io/ranktable": "{\"pod_name\":\"frontend-entry\",\"server_id\":\"frontend\"}"
            "spec":
              "terminationGracePeriodSeconds": 1
              "containers":
                -
                  "name": "workload"
                  "image": "busybox:1.36"
                  "imagePullPolicy": "IfNotPresent"
                  "command":
                    - "sh"
                    - "-c"
                    - "trap 'exit 42' USR1; while :; do sleep 1 & wait $!; done"
                  "env":
                    -
                      "name": "ROLLOUT_VERSION"
                      "value": "A"
                  "readinessProbe":
                    "exec":
                      "command":
                        - "test"
                        - "-f"
                        - "/tmp/ready"
                    "periodSeconds": 1
                    "failureThreshold": 1
                  "resources":
                    "requests":
                      "cpu": "5m"
                      "memory": "4Mi"
              "restartPolicy": "Always"
          "workerTemplate":
            "metadata":
              "annotations":
                "production.kthena.io/ranktable": "{\"pod_name\":\"frontend-worker\",\"server_id\":\"frontend\"}"
            "spec":
              "terminationGracePeriodSeconds": 1
              "containers":
                -
                  "name": "workload"
                  "image": "busybox:1.36"
                  "imagePullPolicy": "IfNotPresent"
                  "command":
                    - "sh"
                    - "-c"
                    - "trap 'exit 42' USR1; while :; do sleep 1 & wait $!; done"
                  "env":
                    -
                      "name": "ROLLOUT_VERSION"
                      "value": "A"
                  "readinessProbe":
                    "exec":
                      "command":
                        - "test"
                        - "-f"
                        - "/tmp/ready"
                    "periodSeconds": 1
                    "failureThreshold": 1
                  "resources":
                    "requests":
                      "cpu": "5m"
                      "memory": "4Mi"
              "restartPolicy": "Always"
      "restartGracePeriodSeconds": 0
    "replicas": 2
    "schedulerName": "volcano"
    "recoveryPolicy": "ServingGroupRecreate"
    "rolloutStrategy":
      "type": "ServingGroupRollingUpdate"
      "rollingUpdateConfiguration":
        "partition": 0
        "maxSurge": 0
        "maxUnavailable": 1
  "steps":
    -
      "name": "entry-of-group-0-becomes-faulty-and-the-group-is-recreated"
      "action": "fault-member"
      "until": "settled"
      "release": "one"
      "holdSeconds": 0
      "stableSeconds": 30
      "expect":
        "twoStepGroupRecovery": true
        "noNewRevision": true
        "targets":
          -
            "scope": "SG"
            "versions":
              "A": 2
        "servingGroups":
          -
            "name": "model-0"
            "objects": 2
            "exists": true
            "terminating": false
            "uidDiffersFrom": "baseline"
            "podNamesSameAs": "baseline"
            "podUIDsDisjointFrom": "baseline"
            "seen":
              - "Failed=True"
              - "Drained=True"
            "foregroundDeletions": 1
          -
            "name": "model-1"
            "objects": 1
            "exists": true
            "terminating": false
            "uidSameAs": "baseline"
            "podUIDsSameAs": "baseline"
            "neverSeen":
              - "Failed=True"
      "containerRestart":
        "group": 0
        "role": "frontend"
        "ordinal": 0
        "member": "entry"
      "timeoutSeconds": 420
