"format": "rollout-runner/v3"
"id": "RUN-657"
"baseline": "538b2825c06bc1e8c5392d18f18f84faee9fca95"
"scenario":
  "requires": "servingGroupObjects"
  "source":
    "id": "RUN-657"
    "designID": "NT4"
    "group": "ServingGroup对象"
    "kind": "运行"
    "contract": "2.14"
    "reference": "kthena/docs/proposal/modelserving-servinggroup-cr/04-behavior-expectations.md#8.7"
    "config":
      "coordination": "omitted"
      "mode": "SG"
      "n": 3
      "plugins": "omitted"
      "recovery": "omitted"
      "roles":
        "f":
          "r": 1
          "w": 1
      "top":
        "p": 0
        "s": 0
        "u": 1
    "initial": "A全Ready"
    "action": "用户以Orphan方式删除ServingGroup model-1（N=3，每组entry+worker）"
    "expect": "ServingGroup对象回来（新UID），成员Pod的UID不变并被收养，版本取Pod的revision标签"
    "mustReject": "orphan的Pod被删，或者一直没人管"
  "profile": "controlled"
  "initialSpec":
    "template":
      "roles":
        -
          "name": "frontend"
          "replicas": 1
          "workerReplicas": 1
          "entryTemplate":
            "metadata":
              "annotations":
                "production.kthena.io/ranktable": "{\"pod_name\":\"frontend-entry\",\"server_id\":\"frontend\"}"
            "spec":
              "terminationGracePeriodSeconds": 1
              "containers":
                -
                  "name": "workload"
                  "image": "busybox:1.36"
                  "imagePullPolicy": "IfNotPresent"
                  "command":
                    - "sh"
                    - "-c"
                    - "sleep 3600"
                  "env":
                    -
                      "name": "ROLLOUT_VERSION"
                      "value": "A"
                  "readinessProbe":
                    "exec":
                      "command":
                        - "test"
                        - "-f"
                        - "/tmp/ready"
                    "periodSeconds": 1
                    "failureThreshold": 1
                  "resources":
                    "requests":
                      "cpu": "5m"
                      "memory": "4Mi"
          "workerTemplate":
            "metadata":
              "annotations":
                "production.kthena.io/ranktable": "{\"pod_name\":\"frontend-worker\",\"server_id\":\"frontend\"}"
            "spec":
              "terminationGracePeriodSeconds": 1
              "containers":
                -
                  "name": "workload"
                  "image": "busybox:1.36"
                  "imagePullPolicy": "IfNotPresent"
                  "command":
                    - "sh"
                    - "-c"
                    - "sleep 3600"
                  "env":
                    -
                      "name": "ROLLOUT_VERSION"
                      "value": "A"
                  "readinessProbe":
                    "exec":
                      "command":
                        - "test"
                        - "-f"
                        - "/tmp/ready"
                    "periodSeconds": 1
                    "failureThreshold": 1
                  "resources":
                    "requests":
                      "cpu": "5m"
                      "memory": "4Mi"
    "replicas": 3
    "schedulerName": "volcano"
    "rolloutStrategy":
      "type": "ServingGroupRollingUpdate"
      "rollingUpdateConfiguration":
        "partition": 0
        "maxSurge": 0
        "maxUnavailable": 1
  "steps":
    -
      "name": "user-deletes-group-1-orphan"
      "action": "delete-serving-group"
      "until": "settled"
      "release": "one"
      "holdSeconds": 0
      "stableSeconds": 30
      "expect":
        "noNewRevision": true
        "targets":
          -
            "scope": "SG"
            "versions":
              "A": 3
        "servingGroups":
          -
            "name": "model-1"
            "objects": 2
            "exists": true
            "terminating": false
            "owned": true
            "uidDiffersFrom": "baseline"
            "podUIDsSameAs": "baseline"
          -
            "name": "model-0"
            "objects": 1
            "exists": true
            "terminating": false
            "uidSameAs": "baseline"
            "podUIDsSameAs": "baseline"
          -
            "name": "model-2"
            "objects": 1
            "exists": true
            "terminating": false
            "uidSameAs": "baseline"
            "podUIDsSameAs": "baseline"
      "groupDelete":
        "group": 1
        "propagation": "Orphan"
      "timeoutSeconds": 420
