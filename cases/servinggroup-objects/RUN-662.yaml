"format": "rollout-runner/v3"
"id": "RUN-662"
"baseline": "538b2825c06bc1e8c5392d18f18f84faee9fca95"
"scenario":
  "requires": "servingGroupObjects"
  "source":
    "id": "RUN-662"
    "designID": "NT45"
    "group": "ServingGroup对象"
    "kind": "运行"
    "contract": "2.14"
    "reference": "kthena/docs/proposal/modelserving-servinggroup-cr/04-behavior-expectations.md#8.7"
    "config":
      "coordination": "omitted"
      "mode": "SG"
      "n": 3
      "plugins": "omitted"
      "recovery": "omitted"
      "roles":
        "f":
          "r": 1
          "w": 0
      "top":
        "p": 0
        "s": 1
        "u": 0
    "initial": "A全Ready"
    "action": "ServingGroup的informer没同步：终止controller，挂住新进程对servinggroups的初始LIST，期间提交B，再放开"
    "expect": "挂住期间不把“没有组”当事实：A的组和Pod保持原UID，不新建组；放开之后按预算滚到B，正式组各替换一次、surge只建一个并被回收"
    "mustReject": "多建组；把撞名字当错误长时间退避；挂住期间删除或重建健康的组"
    "environment": "单个controller副本；本例会终止并重建controller进程，不能与其他用例并行"
  "profile": "controlled"
  "initialSpec":
    "template":
      "roles":
        -
          "name": "frontend"
          "replicas": 1
          "workerReplicas": 0
          "entryTemplate":
            "metadata":
              "annotations":
                "production.kthena.io/ranktable": "{\"pod_name\":\"frontend-entry\",\"server_id\":\"frontend\"}"
            "spec":
              "terminationGracePeriodSeconds": 1
              "containers":
                -
                  "name": "workload"
                  "image": "busybox:1.36"
                  "imagePullPolicy": "IfNotPresent"
                  "command":
                    - "sh"
                    - "-c"
                    - "sleep 3600"
                  "env":
                    -
                      "name": "ROLLOUT_VERSION"
                      "value": "A"
                  "readinessProbe":
                    "exec":
                      "command":
                        - "test"
                        - "-f"
                        - "/tmp/ready"
                    "periodSeconds": 1
                    "failureThreshold": 1
                  "resources":
                    "requests":
                      "cpu": "5m"
                      "memory": "4Mi"
    "replicas": 3
    "schedulerName": "volcano"
    "rolloutStrategy":
      "type": "ServingGroupRollingUpdate"
      "rollingUpdateConfiguration":
        "partition": 0
        "maxSurge": 1
        "maxUnavailable": 0
  "steps":
    -
      "name": "hold-servinggroup-informer-initial-sync-then-automatically-finish-B"
      "action": "hold-initial-sync"
      "until": "settled"
      "release": "one"
      "holdSeconds": 0
      "stableSeconds": 30
      "expect":
        "targets":
          -
            "scope": "SG"
            "versions":
              "B": 3
        "servingGroups":
          -
            "name": "model-3"
            "objects": 1
            "exists": false
            "pods": 0
          -
            "name": "model-4"
            "objects": 0
            "exists": false
          -
            "name": "model-0"
            "objects": 2
            "exists": true
            "terminating": false
            "uidDiffersFrom": "baseline"
            "podNamesSameAs": "baseline"
            "podUIDsDisjointFrom": "baseline"
          -
            "name": "model-1"
            "objects": 2
            "exists": true
            "terminating": false
            "uidDiffersFrom": "baseline"
            "podNamesSameAs": "baseline"
            "podUIDsDisjointFrom": "baseline"
          -
            "name": "model-2"
            "objects": 2
            "exists": true
            "terminating": false
            "uidDiffersFrom": "baseline"
            "podNamesSameAs": "baseline"
            "podUIDsDisjointFrom": "baseline"
      "spec":
        "template":
          "roles":
            -
              "name": "frontend"
              "replicas": 1
              "workerReplicas": 0
              "entryTemplate":
                "metadata":
                  "annotations":
                    "production.kthena.io/ranktable": "{\"pod_name\":\"frontend-entry\",\"server_id\":\"frontend\"}"
                "spec":
                  "terminationGracePeriodSeconds": 1
                  "containers":
                    -
                      "name": "workload"
                      "image": "busybox:1.36"
                      "imagePullPolicy": "IfNotPresent"
                      "command":
                        - "sh"
                        - "-c"
                        - "sleep 3600"
                      "env":
                        -
                          "name": "ROLLOUT_VERSION"
                          "value": "B"
                      "readinessProbe":
                        "exec":
                          "command":
                            - "test"
                            - "-f"
                            - "/tmp/ready"
                        "periodSeconds": 1
                        "failureThreshold": 1
                      "resources":
                        "requests":
                          "cpu": "5m"
                          "memory": "4Mi"
        "replicas": 3
        "schedulerName": "volcano"
        "rolloutStrategy":
          "type": "ServingGroupRollingUpdate"
          "rollingUpdateConfiguration":
            "partition": 0
            "maxSurge": 1
            "maxUnavailable": 0
      "timeoutSeconds": 420
