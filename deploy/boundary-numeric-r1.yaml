apiVersion: batch/v1
kind: Job
metadata:
  name: rollout-boundary-numeric-r1
  namespace: rollout-runner
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 14400
  template:
    spec:
      serviceAccountName: rollout-runner
      restartPolicy: Never
      containers:
        - name: runner
          image: kthena-rollout-runner:recovery-022-r25
          imagePullPolicy: Never
          args:
            - --cases=/cases/boundary-numeric
            - --select=RUN-540,RUN-541,RUN-542,RUN-543,RUN-544,RUN-545,RUN-546,RUN-547,RUN-548,RUN-549,RUN-550,RUN-551,RUN-552,RUN-553,RUN-554,RUN-555,RUN-556,RUN-557,RUN-558,RUN-559,RUN-560,RUN-561,RUN-562,RUN-563,RUN-564,RUN-565
            - --artifacts=/artifacts
            - --phase-timeout=660s
            - --run-id=boundary-numeric-r1
            - --controller-image=kthena-controller-manager:normal-022-538b2825
            - --controller-commit=538b2825c06bc1e8c5392d18f18f84faee9fca95
            - --fault-proxy-api=https://recovery-proxy-022-r6.rollout-runner.svc:8080
            - --fault-proxy-control=http://recovery-proxy-022-r6.rollout-runner.svc:8081
            - --fault-proxy-token-file=/control/token
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 1Gi}
          volumeMounts:
            - {name: results, mountPath: /artifacts}
            - {name: control, mountPath: /control, readOnly: true}
      volumes:
        - name: results
          persistentVolumeClaim:
            claimName: rollout-results
        - name: control
          secret:
            secretName: recovery-proxy-022-control
            defaultMode: 256
