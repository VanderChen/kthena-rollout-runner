apiVersion: batch/v1
kind: Job
metadata:
  name: rollout-boundary-sparse-r2
  namespace: rollout-runner
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 14400
  template:
    spec:
      serviceAccountName: rollout-runner
      restartPolicy: Never
      containers:
        - name: runner
          image: kthena-rollout-runner:recovery-022-r30
          imagePullPolicy: Never
          args:
            - --cases=/cases/boundary-sparse
            - --select=RUN-575,RUN-577,RUN-578,RUN-579,RUN-580,RUN-581,RUN-582,RUN-584,RUN-585,RUN-586,RUN-587,RUN-588,RUN-589,RUN-590,RUN-591,RUN-593,RUN-594,RUN-595,RUN-596,RUN-597,RUN-599,RUN-601,RUN-602,RUN-603
            - --artifacts=/artifacts
            - --phase-timeout=660s
            - --run-id=boundary-sparse-r2
            - --controller-image=kthena-controller-manager:normal-022-538b2825
            - --controller-commit=538b2825c06bc1e8c5392d18f18f84faee9fca95
            - --fault-proxy-api=https://recovery-proxy-022-r6.rollout-runner.svc:8080
            - --fault-proxy-control=http://recovery-proxy-022-r6.rollout-runner.svc:8081
            - --fault-proxy-token-file=/control/token
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 1Gi}
          volumeMounts:
            - {name: results, mountPath: /artifacts}
            - {name: control, mountPath: /control, readOnly: true}
      volumes:
        - name: results
          persistentVolumeClaim:
            claimName: rollout-results
        - name: control
          secret:
            secretName: recovery-proxy-022-control
            defaultMode: 256
