apiVersion: batch/v1
kind: Job
metadata:
  name: rollout-core-60
  namespace: rollout-runner
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 7200
  template:
    spec:
      serviceAccountName: rollout-runner
      restartPolicy: Never
      containers:
        - name: runner
          image: kthena-rollout-runner:dev-021-r3
          imagePullPolicy: IfNotPresent
          args:
            - --cases=/cases/core
            - --artifacts=/artifacts
            - --run-id=core-60-r3
            - --controller-image=kthena-controller-manager:resync-010-e2578d01
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 1Gi}
          volumeMounts:
            - {name: results, mountPath: /artifacts}
      volumes:
        - name: results
          persistentVolumeClaim:
            claimName: rollout-results
