apiVersion: v1
kind: Pod
metadata:
  name: recovery-proxy-022-r1
  namespace: rollout-runner
  labels:
    rollout-runner/proxy: recovery-022-r1
spec:
  serviceAccountName: rollout-runner
  restartPolicy: Never
  containers:
    - name: proxy
      image: kthena-fault-proxy:recovery-022-r1
      imagePullPolicy: Never
      args:
        - --control-token-file=/control/token
        - --journal=/evidence/trace.jsonl
      ports:
        - {name: api, containerPort: 8080}
        - {name: control, containerPort: 8081}
      readinessProbe:
        httpGet: {path: /healthz, port: api}
        periodSeconds: 2
      resources:
        requests: {cpu: 25m, memory: 64Mi}
        limits: {memory: 256Mi}
      volumeMounts:
        - {name: control, mountPath: /control, readOnly: true}
        - {name: evidence, mountPath: /evidence}
  volumes:
    - name: control
      secret:
        secretName: recovery-proxy-022-control
        defaultMode: 256
    - name: evidence
      emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: recovery-proxy-022-r1
  namespace: rollout-runner
spec:
  selector:
    rollout-runner/proxy: recovery-022-r1
  ports:
    - {name: api, port: 8080, targetPort: api}
    - {name: control, port: 8081, targetPort: control}
