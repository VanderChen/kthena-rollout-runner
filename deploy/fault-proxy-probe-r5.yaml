apiVersion: v1
kind: Pod
metadata:
  name: recovery-proxy-022-r5
  namespace: rollout-runner
  labels:
    rollout-runner/proxy: recovery-022-r5
spec:
  serviceAccountName: rollout-runner
  restartPolicy: Never
  containers:
    - name: proxy
      image: kthena-fault-proxy:recovery-022-r5
      imagePullPolicy: Never
      args:
        - --control-token-file=/control/token
        - --journal=/evidence/trace.jsonl
        - --tls-cert=/tls/tls.crt
        - --tls-key=/tls/tls.key
      ports:
        - {name: api, containerPort: 8080}
        - {name: control, containerPort: 8081}
      readinessProbe:
        httpGet: {path: /healthz, port: api, scheme: HTTPS}
        periodSeconds: 2
      resources:
        requests: {cpu: 25m, memory: 64Mi}
        limits: {memory: 256Mi}
      volumeMounts:
        - {name: control, mountPath: /control, readOnly: true}
        - {name: evidence, mountPath: /evidence}
        - {name: tls, mountPath: /tls, readOnly: true}
  volumes:
    - name: control
      secret:
        secretName: recovery-proxy-022-control
        defaultMode: 256
    - name: evidence
      emptyDir: {}
    - name: tls
      secret:
        secretName: recovery-proxy-022-r5-tls
        defaultMode: 256
---
apiVersion: v1
kind: Service
metadata:
  name: recovery-proxy-022-r5
  namespace: rollout-runner
spec:
  selector:
    rollout-runner/proxy: recovery-022-r5
  ports:
    - {name: api, port: 8080, targetPort: api}
    - {name: control, port: 8081, targetPort: control}
