apiVersion: batch/v1
kind: Job
metadata:
  name: rollout-legacy-032-r1
  namespace: rollout-runner
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 3600
  template:
    spec:
      serviceAccountName: rollout-runner
      restartPolicy: Never
      containers:
        - name: runner
          image: kthena-rollout-runner:legacy-032-r1
          imagePullPolicy: IfNotPresent
          args:
            - --cases=/cases/normal
            - --select=RUN-001,RUN-016,RUN-031,RUN-046,RUN-070,RUN-071,RUN-073,RUN-075,RUN-083,RUN-137,RUN-220,RUN-224
            - --artifacts=/artifacts
            - --phase-timeout=180s
            - --run-id=legacy-032-r1
            - --controller-image=kthena-controller-manager:normal-022-538b2825
            - --controller-commit=538b2825c06bc1e8c5392d18f18f84faee9fca95
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 1Gi}
          volumeMounts:
            - {name: results, mountPath: /artifacts}
      volumes:
        - name: results
          persistentVolumeClaim:
            claimName: rollout-results
