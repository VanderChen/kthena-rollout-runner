apiVersion: batch/v1
kind: Job
metadata:
  name: rollout-midrollout-fault-r1
  namespace: rollout-runner
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 28800
  template:
    spec:
      serviceAccountName: rollout-runner
      restartPolicy: Never
      containers:
        - name: runner
          image: kthena-rollout-runner:recovery-022-r3
          imagePullPolicy: Never
          args:
            - --cases=/cases/midrollout-faults
            - --select=RUN-402,RUN-403,RUN-404,RUN-406,RUN-407,RUN-408,RUN-410,RUN-411,RUN-412,RUN-414,RUN-415,RUN-416,RUN-418,RUN-419,RUN-420,RUN-422,RUN-423,RUN-424,RUN-425,RUN-426,RUN-427,RUN-428,RUN-429,RUN-430
            - --artifacts=/artifacts
            - --phase-timeout=420s
            - --run-id=midrollout-fault-r1
            - --controller-image=kthena-controller-manager:normal-022-538b2825
            - --controller-commit=538b2825c06bc1e8c5392d18f18f84faee9fca95
            - --fault-proxy-api=https://recovery-proxy-022-r3.rollout-runner.svc:8080
            - --fault-proxy-control=http://recovery-proxy-022-r3.rollout-runner.svc:8081
            - --fault-proxy-token-file=/control/token
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 1Gi}
          volumeMounts:
            - {name: results, mountPath: /artifacts}
            - {name: control, mountPath: /control, readOnly: true}
      volumes:
        - name: results
          persistentVolumeClaim:
            claimName: rollout-results
        - name: control
          secret:
            secretName: recovery-proxy-022-control
            defaultMode: 256
