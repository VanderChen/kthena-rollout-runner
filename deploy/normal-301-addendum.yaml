apiVersion: batch/v1
kind: Job
metadata:
  name: rollout-normal-r10-301-addendum
  namespace: rollout-runner
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  template:
    spec:
      serviceAccountName: rollout-runner
      restartPolicy: Never
      containers:
        - name: runner
          image: kthena-rollout-runner:normal-022-r10
          imagePullPolicy: IfNotPresent
          args:
            - --cases=/cases/normal
            - --select=RUN-301
            - --artifacts=/artifacts
            - --phase-timeout=420s
            - --run-id=normal-r10-301-addendum
            - --controller-image=kthena-controller-manager:normal-022-538b2825
            - --controller-commit=538b2825c06bc1e8c5392d18f18f84faee9fca95
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 1Gi}
          volumeMounts:
            - {name: results, mountPath: /artifacts}
            - name: corrected-input
              mountPath: /cases/normal/RUN-301.yaml
              subPath: RUN-301.yaml
              readOnly: true
      volumes:
        - name: results
          persistentVolumeClaim:
            claimName: rollout-results
        - name: corrected-input
          configMap:
            name: rollout-normal-r10-301-input
