apiVersion: batch/v1
kind: Job
metadata:
  name: rollout-normal-smoke-r3
  namespace: rollout-runner
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 7200
  template:
    spec:
      serviceAccountName: rollout-runner
      restartPolicy: Never
      containers:
        - name: runner
          image: kthena-rollout-runner:normal-022-r3
          imagePullPolicy: IfNotPresent
          args:
            - --cases=/cases/normal
            - --artifacts=/artifacts
            - --run-id=normal-smoke-r3
            - --select=RUN-082,RUN-086,RUN-099,RUN-101,RUN-107,RUN-119,RUN-123,RUN-127,RUN-132,RUN-138,RUN-151,RUN-153,RUN-155,RUN-160,RUN-162,RUN-166,RUN-195,RUN-211,RUN-237,RUN-243,RUN-263,RUN-282,RUN-303
            - --controller-image=kthena-controller-manager:normal-022-538b2825
            - --controller-commit=538b2825c06bc1e8c5392d18f18f84faee9fca95
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 1Gi}
          volumeMounts:
            - {name: results, mountPath: /artifacts}
      volumes:
        - name: results
          persistentVolumeClaim:
            claimName: rollout-results
