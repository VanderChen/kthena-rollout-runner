apiVersion: batch/v1
kind: Job
metadata:
  name: rollout-plugin-retry-r1
  namespace: rollout-runner
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 14400
  template:
    spec:
      serviceAccountName: rollout-runner
      restartPolicy: Never
      containers:
        - name: runner
          image: kthena-rollout-runner:recovery-022-r11
          imagePullPolicy: Never
          args:
            - --cases=/cases/plugin-retry
            - --select=RUN-536,RUN-537,RUN-538,RUN-539
            - --artifacts=/artifacts
            - --phase-timeout=420s
            - --run-id=plugin-retry-r1
            - --controller-image=kthena-controller-manager:normal-022-538b2825
            - --controller-commit=538b2825c06bc1e8c5392d18f18f84faee9fca95
            - --fault-proxy-api=https://recovery-proxy-022-r4.rollout-runner.svc:8080
            - --fault-proxy-control=http://recovery-proxy-022-r4.rollout-runner.svc:8081
            - --fault-proxy-token-file=/control/token
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 1Gi}
          volumeMounts:
            - {name: results, mountPath: /artifacts}
            - {name: control, mountPath: /control, readOnly: true}
      volumes:
        - name: results
          persistentVolumeClaim:
            claimName: rollout-results
        - name: control
          secret:
            secretName: recovery-proxy-022-control
            defaultMode: 256
