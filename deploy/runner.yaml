apiVersion: v1
kind: Namespace
metadata:
  name: rollout-runner
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rollout-runner
  namespace: rollout-runner
---
# Destructive development/CI cluster only, as agreed in the runner design.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rollout-runner-ci
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: rollout-runner
    namespace: rollout-runner
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rollout-results
  namespace: rollout-runner
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: rollout-results-reader
  namespace: rollout-runner
spec:
  containers:
    - name: reader
      image: busybox:1.36
      imagePullPolicy: IfNotPresent
      command: [sh, -c, 'sleep 604800']
      volumeMounts:
        - {name: results, mountPath: /artifacts}
  volumes:
    - name: results
      persistentVolumeClaim:
        claimName: rollout-results
